<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sneakers O'Toole</title>
<meta name="description" content="An incremental game about a man who will not take his sneakers off.">
<meta name="theme-color" content="#140f2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita+One&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<!--BODY-->
<div id="app" class="booting">
  <header id="top">
    <button id="logo" class="logo" aria-label="Sneakers O'Toole">
      <span class="logo-snk" id="logoSnk"></span>
      <span class="logo-txt">Sneakers<br><em>O'Toole</em></span>
    </button>
    <div class="bank" id="bank">
      <div class="bank-main"><span class="bank-ico" id="bankIco"></span><span id="steps">0</span></div>
      <div class="bank-sub"><b id="sps">0</b> steps per second <span id="spsTags"></span></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="tools">
      <button id="btnWheel" class="tool" aria-label="Wheel of Laces"><span class="ti" id="icoWheel"></span><i class="dot" id="wheelDot" hidden>1</i></button>
      <button id="btnMute" class="tool" aria-label="Mute"><span class="ti" id="icoMute"></span></button>
      <button id="btnSettings" class="tool" aria-label="Settings"><span class="ti" id="icoGear"></span></button>
    </div>
  </header>

  <main id="main">
    <section id="stage" aria-label="Stage">
      <canvas id="bg"></canvas>
      <div id="sprites">
        <button id="otoole" aria-label="Sing">
          <div class="rig">
            <div class="otshadow"></div>
            <img class="pose" data-pose="stand" src="img/otoole-stand.png" alt="" draggable="false">
            <img class="pose" data-pose="walk" src="img/otoole-walk.png" alt="" draggable="false">
            <img class="pose" data-pose="no" src="img/otoole-no.png" alt="" draggable="false">
          </div>
        </button>
      </div>
      <canvas id="fx"></canvas>
      <div id="flash"></div>
      <div id="hud">
        <div id="lyrics" class="lyrics"></div>
        <div id="buffs" class="buffs"></div>
        <div id="bubble" class="bubble"><span></span></div>
        <div id="noBurst" class="no-burst">NO!</div>
        <div id="combo" class="combo"><div class="combo-flame"></div><div class="combo-n">x1.00</div><div class="combo-c">0 combo</div></div>
        <div id="bossbar" class="bossbar" hidden><div class="bb-name"></div><div class="bb-hp"><i></i></div><div class="bb-time"></div></div>
        <div id="banner" class="banner"><div class="bn-tag">BREAKING</div><div class="bn-txt"></div></div>
        <div id="meters" class="meters">
          <div class="meter heat" data-tip="heat"><span class="m-ico" id="icoHeat"></span><div class="m-bar"><i id="heatFill"></i></div></div>
          <div class="meter bossm" data-tip="bossmeter"><span class="m-ico" id="icoBoss"></span><div class="pips" id="bossPips"></div></div>
        </div>
        <div id="sceneTag" class="scene-tag"></div>
        <div id="chTag" class="ch-tag" hidden></div>
      </div>
    </section>

    <section id="panel">
      <nav id="tabs" role="tablist"></nav>
      <div id="views">
        <div class="view" id="v-shop"></div>
        <div class="view" id="v-tree"></div>
        <div class="view" id="v-sneakers"></div>
        <div class="view" id="v-awards"></div>
        <div class="view" id="v-cut"></div>
        <div class="view" id="v-stats"></div>
      </div>
    </section>
  </main>

  <footer id="ticker"><div class="tk-label">QUAHOG NEWS</div><div class="tk-track"><span id="tickText"></span></div></footer>
</div>

<div id="tip" role="tooltip"></div>
<div id="toasts"></div>
<div id="overlay" hidden></div>
<div id="cutFx" hidden><div class="cf-iris"></div><div class="cf-card"><small>CUTAWAY TO</small><b></b></div></div>

<div id="intro">
  <div class="in-gate" id="inGate">
    <div class="in-logo"><span class="in-snk" id="gateSnk"></span><h1>Sneakers<br><em>O'Toole</em></h1><p>The incremental game</p></div>
    <button class="btn big" id="inStart">Press to start</button>
    <small>Sound on for the full experience</small>
  </div>
  <div class="in-show" id="inShow" hidden>
    <div class="in-spot"></div>
    <div class="in-words" id="inWords"></div>
    <img class="in-walker" id="inWalker" src="img/otoole-walk.png" alt="">
    <img class="in-stander" id="inStander" src="img/otoole-stand.png" alt="">
    <div class="in-title" id="inTitle"><span class="in-snk" id="titleSnk"></span><h1>Sneakers<br><em>O'Toole</em></h1><p>The incremental game</p><button class="btn big" id="inPlay">Play</button></div>
  </div>
  <button class="in-skip" id="inSkip" hidden>Skip ›</button>
</div>
<!--/BODY-->
<script src="js/assets.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/stage.js"></script>
<script src="js/ui.js"></script>
<script src="js/intro.js"></script>
<script src="js/main.js"></script>
</body>
</html>
